# Only pods in this namespace may call each other; from outside, only the OpenShift router may
# reach the console (the Route). CAPIF tokens in this lab are unsigned, so this policy -- not the
# token -- is what keeps other tenants away from ptp-bridge, the O-DU's O1 config, the MCP
# servers and the orchestrator. Egress is unrestricted (builds, optional LLM endpoint).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: same-namespace-only
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-to-console
spec:
  podSelector:
    matchLabels: { app: ran-sandbox-controller }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { policy-group.network.openshift.io/ingress: "" }
---
# Automation Orchestrator's AAP jobs run in namespace `aap`. They call exactly two things here: the
# heal playbook posts to the console controller (the same call as the Heal button), and the
# verification step and Close RCA playbook call the NEP orchestrator. Nothing else is opened.
# Egress is unrestricted, so NEP can already reach AO for the webhook.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ao-remediation-from-aap
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [ran-sandbox-controller, nep-orchestrator] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: aap }
      ports:
        - { protocol: TCP, port: 7098 }
        - { protocol: TCP, port: 7095 }
